<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget & Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1>Personal Budget & Expense Tracker</h1>
        <p>Track your budget, expenses, and spending habits.</p>
    </header>

    <main>

        <section class="budget-section">
            <h2>Budget Overview</h2>

            <div class="budget-card">
                <h3>Monthly Budget</h3>
                <p>$0.00</p>
            </div>

            <div class="budget-card">
                <h3>Total Expenses</h3>
                <p>$0.00</p>
            </div>

            <div class="budget-card">
                <h3>Remaining Balance</h3>
                <p>$0.00</p>
            </div>
        </section>

        <section class="expense-section" id="add-expense">
            <h2>Add Expense</h2>

            <form>
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" placeholder="Enter expense">

                <label for="expense-amount">Amount</label>
                <input type="number" id="expense-amount" placeholder="Enter amount">

                <label for="expense-category">Category</label>
                <select id="expense-category">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Bills</option>
                    <option>Entertainment</option>
                    <option>Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expenses-list" id="your-expenses">
    <h2>Your Expenses</h2>
    <p>No expenses yet</p>
</section>

    </main>

    <footer>
        <p>&copy; 2026 Personal Budget & Expense Tracker</p>
    </footer>

</body>
</html>
